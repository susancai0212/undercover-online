<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎭 谁是内鬼</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:linear-gradient(140deg,#fff1f7,#ffe2ee);color:#743958;margin:0}.wrap{max-width:510px;margin:auto;padding:25px 15px}.head{text-align:center}.head h1{color:#b43b74}.card{background:#fffafd;border:1px solid #f4cade;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 5px 24px #d8669215}input,button{width:100%;padding:13px;border-radius:13px;font-size:16px;margin:7px 0}input{border:1px solid #edb8ce;background:white}button{border:0;background:#e96e9e;color:white;font-weight:bold;cursor:pointer}button.alt{background:#f9dfeb;color:#a84274}button:disabled{opacity:.45}.hidden{display:none}.muted{color:#a87791;font-size:13px}.center{text-align:center}.role{border:2px dashed #edafc9;border-radius:20px;min-height:190px;display:grid;place-content:center;text-align:center;gap:10px;background:#fff0f6}.role strong{font-size:35px;color:#ad3973}.player{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f6e0eb}.error{color:#bd285b;font-size:13px;min-height:20px}.code{font-size:30px;letter-spacing:5px;font-weight:800;color:#b43b74}</style><div class="wrap"><div class="head"><div style="font-size:48px">🎭</div><h1>谁是内鬼</h1><p class="muted">异地好友一起抽签 · 每局只有一位内鬼 💗</p></div><section id="home" class="card"><h2>🎀 创建或加入房间</h2><p>你的昵称</p><input id="name" maxlength="24" placeholder="例如：小桃"><p>创建房间：总人数（包括你）</p><input id="total" type="number" min="3" max="30" value="5"><button id="create">✨ 创建房间</button><hr style="border:0;border-top:1px solid #f7d9e6;margin:22px 0"><p>加入朋友的房间</p><input id="joinCode" maxlength="6" placeholder="6位房间号"><button id="join" class="alt">💌 加入房间</button><p id="homeErr" class="error"></p></section><section id="game" class="hidden"><div class="card center"><div class="muted">房间号</div><div id="code" class="code"></div><button id="copy" class="alt">🔗 复制邀请链接</button><p id="status" class="muted"></p></div><div class="card"><h3>💕 在线玩家</h3><div id="players"></div></div><div class="card"><div id="role" class="role"><span style="font-size:44px">🔒</span><strong style="font-size:22px">身份保密中</strong><span class="muted">等待所有玩家加入</span></div><button id="draw" disabled>🎁 抽取我的身份</button><button id="hide" class="alt hidden">🙈 隐藏我的身份</button><button id="reveal" class="alt hidden">👀 再次查看我的身份</button><button id="restart" class="alt hidden">🔄 房主重新开局</button><p id="gameErr" class="error"></p><p class="muted center">每个人只能收到自己的身份 🤫</p></div></section></div><script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=id=>document.getElementById(id);let room=null,id=null,role=null,busy=false;const store=()=>{try{return JSON.parse(localStorage.getItem('spySession')||'null')}catch{return null}};$('joinCode').value=new URLSearchParams(location.search).get('room')||'';$('name').value=localStorage.getItem('spyName')||'';
function request(event,data,cb){s.emit(event,data,res=>{if(!res?.ok){$(room?'gameErr':'homeErr').textContent=res?.error||'网络异常';return}cb?.(res)})}
function enter(res){room=res.room;id=res.id;role=res.role;localStorage.setItem('spySession',JSON.stringify({code:room.code,token:res.token,name:room.players.find(p=>p.id===id)?.name}));localStorage.setItem('spyName',room.players.find(p=>p.id===id)?.name||'');$('home').classList.add('hidden');$('game').classList.remove('hidden');render();if(role)showRole()}
$('create').onclick=()=>request('create',{name:$('name').value,total:Number($('total').value)},enter);$('join').onclick=()=>request('join',{name:$('name').value,code:$('joinCode').value.trim().toUpperCase()},enter);
function blank(){ $('role').innerHTML='<span style="font-size:44px">🔒</span><strong style="font-size:22px">身份保密中</strong><span class="muted">请私下查看你的身份</span>' }
function showRole(){const spy=role==='内鬼';$('role').replaceChildren();const a=document.createElement('span');a.style.fontSize='46px';a.textContent=spy?'🕵️':'💗';const b=document.createElement('strong');b.textContent=role;const c=document.createElement('span');c.className='muted';c.textContent=spy?'嘘！别暴露你的身份！':'快找出隐藏的内鬼！';$('role').append(a,b,c);$('hide').classList.remove('hidden');$('reveal').classList.add('hidden')}
function render(){if(!room)return;$('code').textContent=room.code;$('status').textContent=room.started?`第${room.round}局 · ${room.players.filter(p=>p.drawn).length}/${room.total}人已抽签`:`等待加入：${room.players.length}/${room.total}人`;$('players').replaceChildren();room.players.forEach(p=>{const row=document.createElement('div');row.className='player';const a=document.createElement('span');a.textContent=(p.host?'👑 ':'💗 ')+p.name+(p.id===id?'（我）':'');const b=document.createElement('span');b.className='muted';b.textContent=!p.online?'离线':room.started?(p.drawn?'已抽签 ✓':'待抽签'):'已加入';row.append(a,b);$('players').append(row)});$('draw').disabled=!room.started||!!role||busy;$('draw').textContent=role?'✓ 已抽取':room.started?'🎁 抽取我的身份':'⏳ 等待所有玩家';$('restart').classList.toggle('hidden',!room.started||!room.players.some(p=>p.id===id&&p.host))}
$('draw').onclick=()=>{if(busy||role)return;busy=true;render();request('draw',{},res=>{let n=0;const timer=setInterval(()=>{const v=n++%2?'💗 好人':'🕵️ 内鬼';$('role').textContent=v;if(n>=18){clearInterval(timer);role=res.role;busy=false;showRole();render()}},85)});};$('hide').onclick=()=>{blank();$('hide').classList.add('hidden');$('reveal').classList.remove('hidden')};$('reveal').onclick=showRole;
$('restart').onclick=()=>request('restart',{},()=>{});$('copy').onclick=async()=>{const url=location.origin+location.pathname+'?room='+room.code;try{await navigator.clipboard.writeText(url);$('copy').textContent='✓ 邀请链接已复制'}catch{$('copy').textContent=url}setTimeout(()=>$('copy').textContent='🔗 复制邀请链接',2500)};
s.on('room',r=>{if(room&&room.code===r.code){room=r;render()}});s.on('newRound',()=>{role=null;busy=false;blank();$('hide').classList.add('hidden');$('reveal').classList.add('hidden');$('gameErr').textContent='新的一局开始啦 🎉';render()});s.on('replaced',()=>{location.reload()});s.on('connect',()=>{const v=store();if(v&&!room)request('join',v,enter)});s.on('disconnect',()=>{if(room)$('gameErr').textContent='连接中断，正在自动重连…'});
</script></html>
